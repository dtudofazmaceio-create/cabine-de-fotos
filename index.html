function deco(x,W,H,t){
  let sd=7;const r=()=>(sd=(sd*9301+49297)%233280)/233280,pal=[t.acc,'#ffffff',t.c2,'#fde047'];
  x.save();
  if(t.d==='confetti'||t.d==='dots'||t.d==='stars'){
    for(let i=0;i<(t.d==='dots'?40:60);i++){const px=r()*W,py=r()*H,s=8+r()*(t.d==='dots'?34:16);
      x.globalAlpha=.55;x.fillStyle=pal[i%4];
      if(t.d==='stars'){x.font=s*2+'px serif';x.fillText('✦',px,py)}
      else if(t.d==='dots'){x.beginPath();x.arc(px,py,s,0,7);x.fill()}
      else{x.save();x.translate(px,py);x.rotate(r()*6);x.fillRect(-s/2,-s/4,s,s/2);x.restore()}}}
  x.globalAlpha=1;
  if(t.d==='lines'){x.strokeStyle=t.acc;x.lineWidth=6;x.strokeRect(18,18,W-36,H-36);x.lineWidth=2;x.strokeRect(34,34,W-68,H-68)}
  if(t.d==='bars'){x.fillStyle=t.acc;x.fillRect(0,0,W,16);x.fillRect(0,H-16,W,16)}
  if(t.d==='neon'){x.shadowColor=t.acc;x.shadowBlur=30;x.strokeStyle=t.acc;x.lineWidth=8;x.strokeRect(14,14,W-28,H-28);x.shadowColor='#ec4899';x.strokeStyle='#ec4899';x.lineWidth=4;x.strokeRect(30,30,W-60,H-60)}
  if(t.d==='flags'){const c=['#dc2626','#facc15','#16a34a','#2563eb'],n=Math.round(W/60);
    for(let i=0;i<n;i++){const a=i*W/n,b=a+W/n,y=10+Math.sin(i/n*Math.PI)*14;x.fillStyle=c[i%4];x.beginPath();x.moveTo(a,y);x.lineTo(b,y);x.lineTo((a+b)/2,y+34);x.fill()}}
  if(t.d==='leaves'){x.font='150px serif';x.fillText('🌴',4,150);x.fillText('🌿',W-150,H-6)}
  if(t.d==='hearts'){for(let i=0;i<34;i++){x.globalAlpha=.5;x.fillStyle=pal[i%4];x.font=(18+r()*40)+'px serif';x.fillText('♥',r()*W,r()*H)}x.globalAlpha=1}
  if(t.d==='balloons'){for(let i=0;i<14;i++){const px=r()*W,py=r()*H,s=26+r()*30;x.globalAlpha=.7;x.fillStyle=pal[i%4];x.beginPath();x.ellipse(px,py,s*.8,s,0,0,7);x.fill();x.strokeStyle=t.text;x.globalAlpha=.4;x.lineWidth=2;x.beginPath();x.moveTo(px,py+s);x.quadraticCurveTo(px+14,py+s+30,px,py+s+60);x.stroke()}x.globalAlpha=1}
  if(t.d==='waves'){[[0,.55,t.acc],[16,.4,'#ffffff']].forEach(([o,a,cl],j)=>{x.globalAlpha=a;x.fillStyle=cl;[0,1].forEach(top=>{x.beginPath();x.moveTo(0,top?0:H);for(let i=0;i<=W;i+=10){const y=Math.sin(i/90+j)*14+60+o*2;x.lineTo(i,top?y:H-y)}x.lineTo(W,top?0:H);x.fill()})});x.globalAlpha=1}
  if(t.d==='floral'){const fl=(px,py,s)=>{for(let k=0;k<6;k++){const a=k*1.047;x.globalAlpha=.8;x.fillStyle=pal[k%2];x.beginPath();x.ellipse(px+Math.cos(a)*s,py+Math.sin(a)*s,s*.8,s*.5,a,0,7);x.fill()}x.globalAlpha=1;x.fillStyle=t.text;x.beginPath();x.arc(px,py,s*.35,0,7);x.fill()};[[30,30,34],[W-30,60,26],[40,H-40,30],[W-40,H-30,36],[W-20,H/2,22],[10,H/2,20]].forEach(a=>fl(...a))}
  if(t.d==='gold'){for(let i=0;i<90;i++){x.globalAlpha=.25+r()*.6;x.fillStyle=t.acc;x.beginPath();x.arc(r()*W,r()*H,1+r()*4,0,7);x.fill()}x.globalAlpha=1;x.strokeStyle=t.acc;x.lineWidth=4;x.strokeRect(16,16,W-32,H-32)}
  if(t.d==='deco'){x.strokeStyle=t.acc;[[16,5],[32,2]].forEach(([m,w])=>{const k=40;x.lineWidth=w;x.beginPath();x.moveTo(m+k,m);x.lineTo(W-m-k,m);x.lineTo(W-m,m+k);x.lineTo(W-m,H-m-k);x.lineTo(W-m-k,H-m);x.lineTo(m+k,H-m);x.lineTo(m,H-m-k);x.lineTo(m,m+k);x.closePath();x.stroke()})}
  if(t.d==='snow'){x.fillStyle='#fff';for(let i=0;i<70;i++){x.globalAlpha=.4+r()*.5;x.beginPath();x.arc(r()*W,r()*H,2+r()*7,0,7);x.fill()}x.globalAlpha=1}
  if(t.d==='rays'){x.fillStyle='#fff';x.globalAlpha=.13;for(let i=0;i<24;i+=2){const a=i/24*6.283,b=(i+1)/24*6.283,R=W+H;x.beginPath();x.moveTo(W/2,H/2);x.lineTo(W/2+Math.cos(a)*R,H/2+Math.sin(a)*R);x.lineTo(W/2+Math.cos(b)*R,H/2+Math.sin(b)*R);x.fill()}x.globalAlpha=1}
  if(t.d==='checker'){const s=W/20|0;for(let i=0;i<Math.ceil(W/s);i++)for(let j=0;j<2;j++){x.fillStyle=(i+j)%2?t.acc:t.text;x.fillRect(i*s,j*s,s,s);x.fillRect(i*s,H-(j+1)*s,s,s)}}
  if(t.d==='film'){x.fillStyle='#000';x.globalAlpha=.85;x.fillRect(0,0,34,H);x.fillRect(W-34,0,34,H);x.globalAlpha=1;x.fillStyle=t.acc;for(let y=14;y<H;y+=44){x.fillRect(10,y,14,22);x.fillRect(W-24,y,14,22)}}
  if(t.d==='bubbles'){x.strokeStyle='#fff';x.lineWidth=3;for(let i=0;i<30;i++){x.globalAlpha=.3+r()*.4;x.beginPath();x.arc(r()*W,r()*H,10+r()*40,0,7);x.stroke()}x.globalAlpha=1}
  if(t.d==='stripes'){x.fillStyle=t.acc;x.globalAlpha=.2;x.save();x.rotate(-.5);for(let i=-W;i<H;i+=70)x.fillRect(-W,i,W*3,28);x.restore();x.globalAlpha=1}
  x.restore()}
function compose(f,s,c=cfg){const strip=f==='strip',W=strip?600:900,H=strip?1800:1100,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,c.color);g.addColorStop(1,c.c2||c.color);x.fillStyle=g;x.fillRect(0,0,W,H);
  deco(x,W,H,c);
  const bc=c.pb==='acc'?c.acc:'#fff',rd=c.rd||0,pd=c.pb==='none'?0:10;
  (strip?[0,1,2].map(i=>[40,40+i*510,520,480]):[[50,50,800,800]]).forEach((b,i)=>{
    if(pd){x.save();x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=18;x.fillStyle=bc;x.beginPath();x.roundRect(b[0]-pd,b[1]-pd,b[2]+2*pd,b[3]+2*pd,rd?rd+pd:0);x.fill();x.restore()}
    x.save();x.beginPath();x.roundRect(...b,rd);x.clip();cover(x,s[i],...b);x.restore()});
  const dt=c.dt||new Date().toLocaleDateString('pt-BR'),k=(c.sz||100)/100,U=v=>c.up?String(v).toUpperCase():v,L=strip?[[46*k,1640,c.event],[30,1692,c.foot],[26,1744,dt]]:[[58*k,935,c.event],[36,990,c.foot],[30,1045,dt]];
  x.save();x.fillStyle=c.text;x.textAlign='center';if(c.d==='neon'){x.shadowColor=c.acc;x.shadowBlur=22}
  L.forEach(([sz,y,t],i)=>{if(t){x.font=(i?'':'700 ')+sz+'px '+c.font;x.fillText(U(t),W/2,y,W-80)}});x.restore();
  if(FR[f]&&!c.nofr)x.drawImage(FR[f],0,0,W,H);return cv}

async function begin(f){
  const n=$('#gn')?$('#gn').value.trim():guest.n,k=n.toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'');
  if(!k)return $('#er').textContent='Digite seu nome.';
  let used;try{used=countOf(await gGet(),k)}catch(e){return $('#er').textContent='Sem conexão com o servidor.'}
  if(used>=cfg.max)return $('#er').textContent=`Você já usou suas ${cfg.max} foto(s) permitidas.`;
  fmt=f;guest={n,k,used};
  app.innerHTML=`<div class=cam><video id=v playsinline muted></video><div id=cd></div><div id=fl></div></div><p id=ms class=m>Abrindo câmera…</p><button class=pri id=go disabled>Começar</button><button id=bk>Voltar</button>`;
  $('#bk').onclick=()=>route();
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},audio:false});
    const v=$('#v');v.srcObject=stream;await v.play();
    $('#ms').textContent=f==='strip'?'Vamos fazer 3 poses! Toque em Começar.':'Toque em Começar e sorria!';
    $('#go').disabled=false;$('#go').onclick=shoot}
  catch(e){$('#ms').className='err';$('#ms').textContent='Não consegui acessar a câmera. Permita o acesso e recarregue a página.'}}

function snap(){const v=$('#v'),c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(v,0,0);return c}
async function shoot(){
  $('#go').disabled=true;$('#bk').disabled=true;const N=fmt==='strip'?3:1,shots=[];
  for(let i=0;i<N;i++){
    $('#ms').textContent=N>1?`Pose ${i+1} de ${N}`:'Sorria!';
    for(let c=3;c>0;c--){$('#cd').textContent=c;await sleep(1000)}
    $('#cd').textContent='';shots.push(snap());$('#fl').style.opacity=1;setTimeout(()=>$('#fl').style.opacity=0,150);await sleep(1100)}
  stopCam();const img=compose(fmt,shots).toDataURL('image/jpeg',.88);cfg.confirm?preview(img):result(img)}
function preview(img){
  app.innerHTML=`<h1>Gostou?</h1><img class=res src="${img}"><button class=pri id=ok>Solicitar impressão</button><button id=rf>Refazer</button>`;

function result(img){
  const k=guest.k,f=fmt,left=Math.max(0,cfg.max-guest.used-1);
  app.innerHTML=`<h1>Sua foto ficou pronta!</h1><img class=res src="${img}"><p id=sm class=m></p><div id=ab></div>`;

    $('#sm').className='m';$('#sm').textContent='Enviando solicitação…';$('#ab').innerHTML='';
    try{const ts=Date.now();
      await gSet({[`p-${ts}-${k}-${f}.txt`]:{content:img},[`c-${k}-${ts}.txt`]:{content:'1'}});

  tpl:`<input id=sq placeholder="Buscar modelo…"><div class=chips>${['Todos',...CATS].map(c=>`<button class="chip ${c===cat?'on':''}" data-a=cat data-k="${c}">${c}</button>`).join('')}</div>
    <div class=tpls id=tg>${TPL.map(t=>`<button class="tp ${t.id===cfg.tpl?'on':''}" data-a=tpl data-k="${t.id}" data-cat="${t.k}" data-n="${t.n.toLowerCase()}"><img data-t="${t.id}" ${TC[tk(t)]?'src="'+TC[tk(t)]+'"':''}><b>${t.n}</b><small>${t.k}</small></button>`).join('')}</div>`,
  ev:`<div style="margin-top:12px">${F('event','Título do evento','placeholder="Ex.: Ana &amp; Pedro"')}${F('foot','Mensagem de rodapé','placeholder="Ex.: Obrigado por celebrar conosco"')}${F('dt','Data ou local (vazio = data de hoje)','placeholder="Ex.: 15/11/2026 · Maceió"')}<button data-a=today>Usar a data de hoje</button>${CK('up','Título em MAIÚSCULAS')}${R('sz','Tamanho do título (%)',70,130)}</div>`,
  sty:`<div class=row4 style="margin-top:12px">${CL('color','Fundo 1')}${CL('c2','Fundo 2')}${CL('text','Texto')}${CL('acc','Destaque')}</div>
    <div class=fg><label>Fonte<select data-f=font>${FONTS.map(([n,v])=>`<option value='${v}' ${v===cfg.font?'selected':''}>${n}</option>`).join('')}</select></label>
    <label>Decoração<select data-f=d>${DECOS.map(([v,n])=>`<option value=${v} ${v===cfg.d?'selected':''}>${n}</option>`).join('')}</select></label>
    <label>Borda das fotos<select data-f=pb>${[['w','Branca'],['acc','Cor de destaque'],['none','Sem borda']].map(([v,n])=>`<option value=${v} ${v===cfg.pb?'selected':''}>${n}</option>`).join('')}</select></label>${R('rd','Cantos arredondados',0,40)}
    <button data-a=tpl data-k="${cfg.tpl}">↺ Restaurar cores do modelo</button></div>`,
  png:`<p class=m>Envie um PNG transparente (arte de designer, logo, moldura pronta). Ele é desenhado por cima do modelo.</p>
    <label>Tirinha · 600×1800 px ${FR.strip?'<span class=ok>● ativa</span>':''}<input type=file data-k=strip accept=image/*></label><label>Polaroide · 900×1100 px ${FR.pola?'<span class=ok>● ativa</span>':''}<input type=file data-k=pola accept=image/*></label>
    <label class=ck><input type=checkbox id=r1> Remover moldura própria da tirinha</label><label class=ck><input type=checkbox id=r2> Remover moldura própria da polaroide</label>`};
  return `<div class=studio><div class=card><div class=seg>${DT.map(([k,n])=>`<button class="${k===dtab?'on':''}" data-a=sub data-k=${k}>${n}</button>`).join('')}</div>${P[dtab]}</div>
  <aside class="card pvc"><div class=ph><h2>Prévia ao vivo</h2><div class=seg>${[['both','Ambas'],['strip','Tirinha'],['pola','Polaroide']].map(([k,n])=>`<button class="${k===pf?'on':''}" data-a=pf data-k=${k}>${n}</button>`).join('')}</div></div>
  <div class=stage><div class=pvs data-pf=${pf}><img id=pa><img id=pb></div></div><p class=m style="font-size:12px;margin:12px 0 0">Alterações só chegam aos convidados após “Salvar e publicar” (Ctrl+S).</p></aside></div>`}
async function rules(){
  return `<div class=card style="max-width:680px"><h2>Regras para os convidados</h2>
  <label>Fotos permitidas por convidado<input type=number min=1 data-f=max value="${cfg.max}"></label>
  ${CK('strip','Formato tirinha (3 fotos, 3 poses)')}${CK('pola','Formato polaroide (1 foto)')}${CK('confirm','Convidado confirma a foto antes de enviar (pode refazer sem gastar cota)')}
  
  <p class=m>Lembre de clicar em “Salvar e publicar” para os convidados receberem as mudanças.</p></div>`}
const PP=[['auto','Padrão da impressora'],['10x15','10×15 cm (4×6")',10,15],['a6','A6 · 10,5×14,8 cm',10.5,14.8],['13x18','13×18 cm (5×7")',13,18],['15x20','15×20 cm (6×8")',15,20],['a5','A5 · 14,8×21 cm',14.8,21],['a4','A4 · 21×29,7 cm',21,29.7],['let','Carta · 21,6×27,9 cm',21.6,27.9]];
const PRD={stP:'auto',stW:5,stN:1,poP:'auto',poW:10};let PR={...PRD},PEN=0;
const nm=k=>k.charAt(0).toUpperCase()+k.slice(1),f1=v=>String(+v.toFixed(1)).replace('.',',');
function lay(kind){const st=kind==='strip',w=Math.max(1,+(st?PR.stW:PR.poW)||(st?5:10)),h=st?w*3:w*1100/900,n=st?Math.max(1,PR.stN|0||1):1,pp=PP.find(x=>x[0]===(st?PR.stP:PR.poP)),tw=n*w;let pg=pp&&pp[2]?[pp[2],pp[3]]:null;
  if(pg&&(tw>pg[0]||h>pg[1])&&tw<=pg[1]&&h<=pg[0])pg=[pg[1],pg[0]];
  return{w,h,n,pg,tw,over:!!pg&&(tw>pg[0]+.01||h>pg[1]+.01)}}
function sheet(k){const L=lay(k),pw=L.pg?L.pg[0]:L.tw*1.25,ph=L.pg?L.pg[1]:L.h*1.15,it=`<i style="width:${L.w/pw*100}%;aspect-ratio:${L.w}/${L.h}"></i>`;
  return `<div class=sheet style="aspect-ratio:${pw}/${ph}"><div class=sit>${it.repeat(L.n)}</div></div><p class=m style="font-size:13px;margin:6px 0 0">Cada foto: <b>${f1(L.w)}×${f1(L.h)} cm</b>${L.n>1?' · '+L.n+' por folha':''} · ${L.pg?'Folha '+f1(L.pg[0])+'×'+f1(L.pg[1])+' cm'+(L.pg[0]>(PP.find(x=>x[0]===(k==='strip'?PR.stP:PR.poP))||[])[2]?' (horizontal)':''):'Folha padrão da impressora'}${L.over?'<br><span class=err>⚠ Não cabe na folha escolhida. Reduza o tamanho ou escolha um papel maior.</span>':''}</p>`}
async function prn(){
  const blk=(k,t,pr)=>{const st=k==='strip',pp=st?'stP':'poP',wk=st?'stW':'poW';return `<div class=card><h2>${t}</h2>
  <label>Papel<select data-p=${pp}>${PP.map(x=>`<option value=${x[0]} ${PR[pp]===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label>
  <label style="margin-top:14px">Tamanho da foto impressa</label><div class=chips id=ch-${k}>${pr.map(w=>`<button class="chip ${+PR[wk]===w?'on':''}" data-a=psz data-k="${k}:${w}">${w}×${st?w*3:f1(w*1100/900)} cm</button>`).join('')}</div>
  <label>Largura personalizada (cm)<input type=number step=.1 min=2 max=30 data-p=${wk} value="${PR[wk]}"></label>
  ${st?`<label>Tirinhas por folha (lado a lado)<select data-p=stN>${[1,2,3,4].map(n=>`<option ${PR.stN==n?'selected':''}>${n}</option>`).join('')}</select></label>`:''}
  <div id=sh-${k}>${sheet(k)}</div></div>`};
  return `<div class=g2c>${blk('strip','Tirinha (proporção 1:3)',[3,4,5,6,7,8])}${blk('pola','Polaroide',[6,8,9,10,12,15])}</div>
  <div class=card><h2>Liberação e testes</h2><label class=ck><input type=checkbox data-a=auto ${AUTO?'checked':''}> Imprimir automaticamente, sem aprovação (desligado: você decide cada foto)</label>
  <p class=m style="font-size:13px">Estes ajustes valem para este computador e já são aplicados na hora. Na janela de impressão do navegador, deixe a escala em 100% e as margens em “Nenhuma”.</p>
  <button data-a=ptest data-k=strip>Imprimir teste · tirinha</button><button data-a=ptest data-k=pola>Imprimir teste · polaroide</button></div>`}
function prUpd(){for(const k of['strip','pola']){const e=$('#sh-'+k);if(e)e.innerHTML=sheet(k);const w=+PR[k==='strip'?'stW':'poW'];document.querySelectorAll('#ch-'+k+' .chip').forEach(b=>b.classList.toggle('on',+b.dataset.k.split(':')[1]===w))}}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.5);o.start();o.stop(c.currentTime+.5);setTimeout(()=>c.close(),700)}catch(e){}}
function toast(h){let b=$('#ts');if(!b){b=document.createElement('div');b.id='ts';b.onclick=act;document.body.appendChild(b)}const t=document.createElement('div');t.className='toast';t.innerHTML=h;t.addEventListener('click',e=>{if(e.target.closest('button'))setTimeout(()=>t.remove(),50)});b.appendChild(t);setTimeout(()=>t.remove(),25000)}
function notify(nw){beep();const o=nw.length===1,fm=x=>x==='strip'?'Tirinha':'Polaroide',tx=o?nm(nw[0].k)+' · '+fm(nw[0].f):nw.length+' novas fotos';
  toast(`<div><b>📸 ${o?'Nova foto':'Novas fotos'}</b><br><span class=m>${esc(tx)} aguardando liberação</span></div>${o?`<button class=pri data-a=pr data-k="${esc(nw[0].n)}">Imprimir</button>`:''}<button data-a=gq>Ver fila</button>`);
  if('Notification' in window&&Notification.permission==='granted'&&document.hidden)try{new Notification('Cabine de Fotos',{body:tx+' aguardando liberação'})}catch(e){}}
async function badge(){PEN=(await pAll()).filter(p=>p.status==='pending').length;document.title=(PEN?'('+PEN+') ':'')+'Cabine de Fotos';const q=document.querySelector('.sb nav [data-k=queue]');if(q)q.dataset.n=PEN;const b=$('#bc');if(b){b.textContent=PEN;b.hidden=!PEN}}
async function queue(){
  const ps=(await pAll()).sort((a,b)=>b.ts-a.ts),pe=ps.filter(p=>p.status==='pending'),pr=ps.filter(p=>p.status!=='pending');
  const card=p=>`<div class="qi ${p.status==='pending'?'pend':''}"><img src="${p.img}"><b>${esc(nm(p.guest))}</b><span class=m>${p.fmt==='strip'?'Tirinha':'Polaroide'} · ${new Date(p.ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span><div class=qb>${p.status==='pending'?`<button class=pri data-a=pr data-k="${esc(p.name)}">Imprimir</button><button data-a=rm data-k="${esc(p.name)}">Recusar</button>`:`<button data-a=pr data-k="${esc(p.name)}">Reimprimir</button><a download="foto-${esc(p.guest)}-${p.ts}.jpg" href="${p.img}">Baixar</a><button data-a=rm data-k="${esc(p.name)}">✕</button>`}</div></div>`;
  return `<div class=card><div class=ph><h2>Aguardando liberação <small class=m>${pe.length}</small></h2>${pe.length?`<button class=pri data-a=pa>Imprimir todas (${pe.length})</button>`:''}</div><div class=qg>${pe.map(card).join('')||'<p class=m>Nenhuma foto aguardando.</p>'}</div></div>
  <div class=card><h2>Já impressas <small class=m>${pr.length}</small></h2><div class=qg>${pr.map(card).join('')||'<p class=m>Nada impresso ainda.</p>'}</div><p><button data-a=lq>Limpar fila deste computador</button></p></div>`}
async function guests(){
  const c={};if(GG)Object.keys(GG.files).forEach(n=>{const m=n.match(/^c-([a-z0-9]+)-\d+\.txt$/);if(m)c[m[1]]=(c[m[1]]||0)+1});
  const ks=Object.keys(c);
  return `<div class=card><h2>Convidados</h2><table><tr><th>Convidado</th><th>Fotos usadas</th><th></th></tr>${ks.map(k=>`<tr><td>${esc(k)}</td><td>${c[k]} / ${cfg.max}</td><td><button data-a=zr data-k="${esc(k)}">Zerar</button></td></tr>`).join('')||'<tr><td colspan=3 class=m>Nenhum convidado ainda.</td></tr>'}</table><p><button data-a=za>Zerar todos (novo evento)</button></p></div>`}
async function conn(){
  return `<div class=grid2><div class=card><h2>Sincronização (GitHub Gist)</h2><label>Token do GitHub (classic, permissão gist)<input id=tk type=password value="${esc(S.tok||'')}"></label><label>ID do Gist<input id=gi value="${esc(S.gid||'')}" placeholder="vazio = criar um novo"></label><button class=pri data-a=ss>Salvar / criar Gist</button><p id=cm class=m></p></div>
  <div class=card><h2>QR Code dos convidados</h2><label>Endereço desta página (HTTPS)<input id=lk value="${esc(location.href.split('#')[0])}"></label><div id=qr></div><button data-a=qp>Imprimir QR</button></div></div>`}

const mkqr=()=>{const q=$('#qr');if(!q)return;q.innerHTML='';if(S.gid&&window.QRCode)new QRCode(q,{text:$('#lk').value.trim()+'#g='+S.gid+'.'+S.tok,width:240,height:240,correctLevel:QRCode.CorrectLevel.L})};
let DM;const getDM=()=>{if(!DM){DM=document.createElement('canvas');DM.width=800;DM.height=600;const x=DM.getContext('2d'),g=x.createLinearGradient(0,0,800,600);g.addColorStop(0,'#fbcfe8');g.addColorStop(1,'#93c5fd');x.fillStyle=g;x.fillRect(0,0,800,600);x.fillStyle='rgba(255,255,255,.65)';x.beginPath();x.arc(400,250,95,0,7);x.fill();x.beginPath();x.ellipse(400,600,180,210,0,Math.PI,0);x.fill()}return DM};
function prevNow(){const a=$('#pa');if(!a)return;const d=getDM();a.src=compose('strip',[d,d,d]).toDataURL('image/jpeg',.7);$('#pb').src=compose('pola',[d]).toDataURL('image/jpeg',.7);filt();thumbs()}
const prev=()=>{clearTimeout(pt);pt=setTimeout(prevNow,120)};
const filt=()=>{const q=($('#sq')||{value:''}).value.toLowerCase();document.querySelectorAll('.tp').forEach(b=>b.hidden=!((cat==='Todos'||b.dataset.cat===cat)&&b.dataset.n.includes(q)))};
async function thumbs(){if(!$('#tg'))return;const v=++tgv;for(const t of TPL){if(v!==tgv)return;const im=$('img[data-t="'+t.id+'"]'),k=tk(t);if(!im)return;if(!TC[k]){TC[k]=compose('pola',[getDM()],{...cfg,...tc(t),nofr:1}).toDataURL('image/jpeg',.5);await sleep(0)}im.src=TC[k]}}

async function inp(e){const t=e.target;
  if(t.dataset.p){const v=t.value;PR[t.dataset.p]=v!==''&&!isNaN(+v)?+v:v;kvSet('pr',PR);return prUpd()}if(t.id==='lk')return mkqr();if(t.id==='sq')return filt();
  if(t.type==='file'){const f=t.files[0];if(!f)return;const k=t.dataset.k,W=k==='strip'?600:900,H=k==='strip'?1800:1100,b=await createImageBitmap(f),c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(b,0,0,W,H);newFr[k]=c.toDataURL('image/png');FR[k]=await loadImg(newFr[k]);dirty();return prev()}
  const f=t.dataset.f;if(!f)return;
  cfg[f]=t.type==='checkbox'?t.checked:t.type==='number'?Math.max(1,+t.value||1):t.type==='range'?+t.value:t.value;if(t.type==='range'){const o=t.parentNode.querySelector('output');o&&(o.textContent=t.value)}dirty();if(f==='font'||t.type==='color'||f==='event'||f==='foot'||f==='dt')cfg.tpl=cfg.tpl;prev()}
async function act(e){
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,k=t.dataset.k;
  try{
  if(a==='tab')return show(k);
  if(a==='tpl'){const m=TPL.find(x=>x.id===k);if(!m)return;Object.assign(cfg,tc(m));dirty();if(dtab!=='tpl')return page();document.querySelectorAll('.tp').forEach(b=>b.classList.toggle('on',b.dataset.k===k));return prevNow()}
  if(a==='sub'){dtab=k;return page()}
  if(a==='cat'){cat=k;document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.dataset.k===k));return filt()}
  if(a==='pf'){pf=k;$('.pvs').dataset.pf=k;document.querySelectorAll('.pvc .seg button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));return}
  if(a==='today'){cfg.dt=new Date().toLocaleDateString('pt-BR');dirty();return page()}
  if(a==='psz'){const[kk,w]=k.split(':'),f=kk==='strip'?'stW':'poW';PR[f]=+w;kvSet('pr',PR);const i=$('input[data-p='+f+']');if(i)i.value=w;return prUpd()}
  if(a==='ptest'){const d=getDM();return printImg(compose(k,k==='strip'?[d,d,d]:[d]).toDataURL('image/jpeg',.92),k)}
  if(a==='gq')return show('queue');
  if(a==='notif'){await Notification.requestPermission();return page()}
  if(a==='pa'){for(const p of(await pAll()).filter(p=>p.status==='pending').sort((x,y)=>x.ts-y.ts)){printImg(p.img,p.fmt);p.status='printed';await pPut(p);await sleep(3000)}await badge();return page()}
  if(a==='auto'){AUTO=t.checked;return kvSet('auto',AUTO)}
  if(a==='sv')return save();
  if(a==='pr'){const p=await pGet(k);printImg(p.img,p.fmt);p.status='printed';await pPut(p);await badge();return page()}
  if(a==='rm'){await pDel(k);await badge();return page()}
  if(a==='lq'){if(confirm('Apagar todas as fotos guardadas neste computador?')){for(const p of await pAll())await pDel(p.name);page()}return}
  if(a==='zr'||a==='za'){if(!S.gid||(a==='za'&&!confirm('Liberar a cota de todos os convidados?')))return;const g=await gGet(),d={};Object.keys(g.files).filter(n=>a==='za'?n.startsWith('c-'):n.startsWith('c-'+k+'-')).forEach(n=>d[n]=null);if(Object.keys(d).length)await gSet(d);return tick()}
  if(a==='qp'){const q=$('#qr canvas');if(!q)return;const c=document.createElement('canvas');c.width=600;c.height=800;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,600,800);x.fillStyle='#000';x.textAlign='center';x.font='700 44px Georgia,serif';x.fillText(cfg.event,300,90,540);x.font='30px Georgia,serif';x.fillText('Escaneie e tire sua foto!',300,150,540);x.drawImage(q,60,200,480,480);return printImg(c.toDataURL(),'qr')}
  if(a==='ss'){S={tok:$('#tk').value.trim(),gid:$('#gi').value.trim()};
    if(!S.gid)S.gid=(await gh('POST','',{description:'Cabine de Fotos',public:false,files:{'config.json':{content:JSON.stringify(cfg)}}})).id;else await gGet();
    await kvSet('sync',S);return admin()}
  }catch(er){const m=$('#cm');if(m){m.className='err';m.textContent='Não conectou: confira token e ID ('+er.message+').'}}}
async function save(){
  if(!S.gid){alert('Configure o Gist na aba Conexão e QR.');return}
  const b=$('#sv');b.disabled=true;
  try{const files={'config.json':{content:JSON.stringify(cfg)}};
    [['strip','r1'],['pola','r2']].forEach(([k,id])=>{const c=$('#'+id);if(c&&c.checked&&FR[k]&&!newFr[k]){files['frame-'+k+'.txt']=null;FR[k]=null}});
    for(const k in newFr)files['frame-'+k+'.txt']={content:newFr[k]};
    await gSet(files);newFr={};dirt=0;$('#dr').textContent='✅ Publicado para os convidados'}
  catch(e){$('#dr').textContent='Falha ao salvar: '+e.message}
  b.disabled=false}

async function tick(){
  if(busy||!S.gid||!$('#nv'))return;busy=1;
  try{const g=await gGet();GG=g;const names=Object.keys(g.files).filter(n=>n.startsWith('p-')).sort(),del={},nw=[];
    for(const n of names){
      if(!await pGet(n)){const[,ts,k,f]=n.replace('.txt','').split('-');await pPut({name:n,ts:+ts,guest:k,fmt:f,img:await txt(g.files[n]),status:'pending'});nw.push({k,f,n})}
      del[n]=null}
    if(names.length)await gSet(del);if(nw.length)notify(nw);
    if(AUTO)for(const p of(await pAll()).filter(p=>p.status==='pending').sort((a,b)=>a.ts-b.ts)){printImg(p.img,p.fmt);p.status='printed';await pPut(p);await sleep(3000)}
    await badge();const y=$('#sy');if(y){y.className='ok';y.textContent='● Conectado · '+new Date().toLocaleTimeString('pt-BR')}
    if(['home','queue','guests'].includes(tab))page()}
  catch(e){const y=$('#sy');if(y){y.className='err';y.textContent='● Sem conexão com o Gist'}}
  busy=0}

init();
</script></body></html>
